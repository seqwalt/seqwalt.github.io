---
layout: default
title: Projects
---

	<ul class="proj">
	<table>
		{% for project in site.project_pages %}
			<tr>
				<td><img src="{{ project.thumbnail }}" alt="{{ project.title }}" width="250" class="left-picture"/></td>
				<!-- <a href="{{ project.url }}"><h2>{{ project.title }}</h2></a> -->
				<td><h2>{{ project.title }}</h2>{{ project.excerpt }}</td> <!-- uncomment the above line to be able to
				access project links -->
			</tr>
		{% endfor %}
	</table>
